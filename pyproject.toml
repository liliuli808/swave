[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swave-forward"
version = "0.1.0"
description = "Pure-Python Rayleigh-wave forward modeling and neural surrogate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.5",
  "numba>=0.66",
  "scipy>=1.14",
  "h5py>=3.11",
  "matplotlib>=3.9",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
swave = "swave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
